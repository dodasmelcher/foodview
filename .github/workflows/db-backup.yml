name: Weekly DB backup

# Free automated backup for the Supabase (Free-tier) database, which has no
# backups of its own. Dumps the whole DB weekly, encrypts it with AES256, and
# stores it as a workflow artifact. Encryption is mandatory because this repo is
# PUBLIC — an unencrypted dump would leak every user's data. If a run fails,
# GitHub emails the repo owner automatically (default notification settings).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Supabase → Settings → Database → Connection string (URI).
#                      Use the "Session"/direct connection, NOT the transaction
#                      pooler (pg_dump needs a session connection).
#   BACKUP_PASSPHRASE  Any strong passphrase; needed to decrypt the dump later.
#
# Restore later:
#   gpg --batch --passphrase '<BACKUP_PASSPHRASE>' -d foodview-YYYYMMDD-HHMM.dump.gpg > db.dump
#   pg_restore --no-owner --no-privileges -d '<SUPABASE_DB_URL>' db.dump

on:
  schedule:
    - cron: '0 5 * * 0'   # Sundays 05:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::Missing SUPABASE_DB_URL or BACKUP_PASSPHRASE secret."; exit 1
          fi
          ts=$(date -u +%Y%m%d-%H%M)
          # The runner ships an older pg_dump on PATH (/usr/bin) that refuses to
          # dump a newer server. Use the highest client we installed explicitly.
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "foodview-$ts.dump"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" -o "foodview-$ts.dump.gpg" "foodview-$ts.dump"
          rm -f "foodview-$ts.dump"
          echo "Backup created: foodview-$ts.dump.gpg ($(du -h "foodview-$ts.dump.gpg" | cut -f1))"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: '*.dump.gpg'
          retention-days: 90
