name: Uptime healthcheck

# Pings the live site and the backend once an hour. The keepalive endpoint
# returns 200 only when Supabase is actually reachable, so this also catches a
# Supabase pause/outage — not just a Vercel one. If a check fails the job fails,
# and GitHub emails the repo owner automatically (default notification settings).
# No secrets needed; only hits public URLs. Free (public repo = unlimited minutes).

on:
  schedule:
    - cron: '17 * * * *'   # hourly, at :17
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site + backend
        run: |
          set -euo pipefail
          check () {
            code=$(curl -sS -o /tmp/out -w "%{http_code}" --max-time 25 "$1" || echo 000)
            echo "$2 → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$2 is unhealthy (HTTP $code) — $1"; return 1
            fi
          }
          check "https://foodview-gules.vercel.app/" "site"
          check "https://foodview-gules.vercel.app/api/keepalive" "backend (Supabase)"
